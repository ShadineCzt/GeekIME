patch:
  # 默认主题
  "style/color_scheme": geek_light
  "style/horizontal": true # 横排显示

  # ---------- 布局美化 ----------
  "style/font_face": "Microsoft YaHei UI"
  "style/label_font_face": "Microsoft YaHei UI"
  "style/comment_font_face": "Microsoft YaHei UI"
  "style/font_point": 15
  "style/label_font_point": 13
  "style/comment_font_point": 12
  "style/label_format": "%s."
  "style/layout/corner_radius": 6
  "style/layout/hilite_padding": 4
  "style/layout/border_width": 1
  "style/layout/margin_x": 14
  "style/layout/margin_y": 12
  "style/layout/spacing": 12
  "style/layout/candidate_spacing": 6
  "style/layout/shadow_radius": 6
  "style/layout/shadow_offset_x": 2
  "style/layout/shadow_offset_y": 3

  # ---------- 主题1：极客白（默认，对标搜狗默认皮肤） ----------
  "preset_color_schemes/geek_light":
    name: "极客白／Geek Light"
